name: hr_app
description: A new Flutter project.

publish_to: 'none'

version: 1.0.2+8

environment:
  sdk: '>=3.8.0 <4.0.0'

dependencies:
  cached_network_image: ^4.0.4
  calendar_view: ^2.0.0
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  geolocator: ^14.1.1
  get_it: ^9.3.0
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  image_picker: ^1.0.4
  lottie: ^3.6.1
  shared_preferences: ^2.2.2
  shimmer: ^4.0.0
  dio: ^5.7.0
  upgrader: ^13.7.0
  image_cropper: ^13.0.0
  fpdart: ^1.1.0
  freezed_annotation: 3.1.0
  json_annotation: ^4.12.0
  connectivity_plus: ^7.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_native_splash: ^2.3.7
  build_runner: ^2.4.8
  freezed: 4.0.3
  json_serializable: ^6.8.0
  mocktail: ^1.0.4

flutter_native_splash:
  color: '#141C25'
  color_dark: '#141C25'
  image: 'assets/images/splash_logo.png'
  image_dark: 'assets/images/splash_logo.png'
  android_12:
    color: '#141C25'
    color_dark: '#141C25'
    image: 'assets/images/splash_android12.png'
    image_dark: 'assets/images/splash_android12.png'
  android: true
  ios: true
  fullscreen: true

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
    - assets/lottie/
    - assets/fonts/





  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo.ttf
          weight: 400
        - asset: assets/fonts/Cairo.ttf
          weight: 500
        - asset: assets/fonts/Cairo.ttf
          weight: 600
        - asset: assets/fonts/Cairo.ttf
          weight: 700
        - asset: assets/fonts/Cairo.ttf
          weight: 800
        - asset: assets/fonts/Cairo.ttf
          weight: 900

